name: Release

# Publishing a GitHub Release (tag like v0.2.0) builds the API image and pushes it to GitHub's container
# registry as ghcr.io/<owner>/agentledger-api:<version> and :latest. The stable ledger runs that image.
on:
  release:
    types: [published]

jobs:
  # The same checks as every push: formatting, build, all tests, Native AOT publish of the CLI.
  ci:
    uses: ./.github/workflows/ci.yml

  api-image:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push to ghcr.io with the workflow's own token
    steps:
      - uses: actions/checkout@v7

      - name: Read the version from the release tag
        id: version
        run: |
          version="${GITHUB_REF_NAME#v}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Release tag '$GITHUB_REF_NAME' is not a version like v1.2.3 or v1.2.3-rc.1" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # Registry paths must be lowercase; the owner name may not be.
          echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/agentledger-api" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tags: the exact version, and "latest" for normal releases (not for pre-releases like 1.2.0-rc.1).
      # Also adds OCI labels linking the image to this repository.
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.version.outputs.image }}
          tags: |
            type=raw,value=${{ steps.version.outputs.version }}
            type=raw,value=latest,enable=${{ !github.event.release.prerelease }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            SOURCE_REVISION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
