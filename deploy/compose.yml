# The stable AgentLedger ledger: the released API image plus its own Postgres (see docs/adr/0014).
# Deploy as a Portainer stack (paste this file, or point Portainer at deploy/compose.yml in the repo),
# or run it directly:  DB_PASSWORD=... docker compose -f deploy/compose.yml up -d
#
# Variables (set them in Portainer's "Environment variables" for the stack):
#   DB_PASSWORD        required; the ledger database's password
#   AGENTLEDGER_PORT   optional; host port for the API (default 58080)
#   AGENTLEDGER_IMAGE  optional; defaults to the latest release on GitHub's container registry
#
# Updating: after publishing a GitHub Release, use Portainer's "Pull and redeploy" (or
# `docker compose pull && docker compose up -d`). Data lives in the ledger-data volume and survives
# updates; migrations run when the new API starts; hook events sent meanwhile wait in the CLI's spool.

services:
  api:
    image: ${AGENTLEDGER_IMAGE:-ghcr.io/ericmaibach/agentledger-api:latest}
    ports:
      - "${AGENTLEDGER_PORT:-58080}:8080"
    environment:
      ConnectionStrings__AgentLedger: Host=db;Database=agentledger;Username=agentledger;Password=${DB_PASSWORD:?Set DB_PASSWORD for the ledger database}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      # The runtime image has no curl or wget, so this asks /status for its HTTP status using bash alone.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /status HTTP/1.0\\r\\n\\r\\n' >&3 && head -1 <&3 | grep -q ' 200 '"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  db:
    image: postgres:18
    environment:
      POSTGRES_DB: agentledger
      POSTGRES_USER: agentledger
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD for the ledger database}
    volumes:
      - ledger-data:/var/lib/postgresql # Postgres 18+ expects the mount here, not .../data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentledger -d agentledger"]
      interval: 10s
      timeout: 5s
      retries: 5
    # No published port: only the API talks to the ledger database, over the stack's private network.

volumes:
  ledger-data:
